<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NYLON | Archivo de Proyectos Cinemático V.3.0 (Mobile)</title>
    
    <script>
        // REDIRECT A PC
        if (window.innerWidth > 768) {
            window.location.replace("portfolio.html");
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --petrol: #209180;
            --bg: #020205;
            --white-glow: rgba(255, 255, 255, 0.3);
            --blue-glow: rgba(32, 145, 128, 0.4);
            --card-w: min(75vw, 320px);
            --card-h: calc(var(--card-w) * 16 / 9);
        }
            
        ::-webkit-scrollbar { width: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(32, 145, 128,0.3); border-radius: 4px; }
        
        body { margin: 0; background-color: var(--bg); overflow: hidden; font-family: 'Space Grotesk', sans-serif; }

        #starfield {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
        }

        .hud-vignette {
            position: fixed; inset: 0; z-index: 50; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(2,2,5,0.80) 100%);
        }

        #staff-nav {
            position: fixed; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 92%;
            max-width: 1200px;
            z-index: 2000;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 10px 14px !important;
            min-height: 60px;
            background: rgba(5, 5, 12, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            flex-direction: column; 
            gap: 15px;
        }
        .nav-logo {
            font-size: 14px; font-weight: 700; letter-spacing: 6px;
            color: rgba(32, 145, 128,0.7); text-transform: uppercase;
        }
        .nav-links {
            display: flex; gap: 10px; align-items: center;
            background: rgba(0,5,15,0.5);
            border: 1px solid rgba(32, 145, 128,0.18);
            border-top: 2px solid var(--petrol);
            padding: 8px 10px;
            backdrop-filter: blur(10px);
            flex-wrap: wrap; 
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }
                #staff-nav a {
            color: rgba(255,255,255,0.95); text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: capitalize;
            transition: color 0.3s, text-shadow 0.3s; position: relative;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        #staff-nav a::before, #staff-nav a::after {
            position: absolute; opacity: 0; transition: all 0.3s; color: #1fa694;
        }
        #staff-nav a::before { content: '['; left: -10px; }
        #staff-nav a::after  { content: ']'; right: -10px; }
        #staff-nav a:hover { color: #1fa694; text-shadow: 0 0 12px rgba(31,166,148,0.7); }
        #staff-nav a:hover::before { opacity: 1; left: -13px; }
        #staff-nav a:hover::after  { opacity: 1; right: -13px; }

        #sector-hud {
            position: fixed; top: 120px; left: 50%; transform: translateX(-50%);
            z-index: 150; text-align: center; pointer-events: none; width: 100%;
        }
        #sector-index {
            font-size: 64px; font-weight: 700; line-height: 1;
            color: rgba(255,255,255,0.04); letter-spacing: 4px;
        }
        #sector-name {
            font-size: 10px; letter-spacing: 3px;
            color: rgba(32, 145, 128,0.55); text-transform: uppercase;
            transition: opacity .4s;
            margin-top: -10px;
            padding: 0 20px;
        }

        #stage {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            padding-top: 80px; 
        }
        
        #carousel {
            position: relative;
            width: var(--card-w);
            height: var(--card-h);
        }

        .orb-card {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,5,18,0.85);
            border: 1px solid rgba(32, 145, 128,0.10);
            backdrop-filter: blur(6px);
            overflow: hidden;
            display: flex; flex-direction: column;
            border-radius: 2px;
            transition: box-shadow .5s, border-color .5s,
                        transform .38s cubic-bezier(.25,.46,.45,.94),
                        opacity .38s ease;
        }
        .orb-card.active {
            border-color: rgba(32, 145, 128,0.45);
            box-shadow: 0 0 40px 8px rgba(32, 145, 128,0.25),
                        inset 0 0 30px rgba(32, 145, 128,0.04);
        }

        .card-media { position: relative; height: 75%; overflow: hidden; }
        .card-media video { width: 100%; height: 100%; object-fit: cover; }
        
        .card-info {
            height: 25%; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.9); border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center; padding: 10px;
        }
        .card-title {
            font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; color: #fff;
            margin-bottom: 5px;
        }
        .card-tag { font-family: "Instrument Serif", serif; font-size: 0.9rem; font-style: italic; color: var(--petrol); }
        .card-cta { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 5px; letter-spacing: 1px; }

        #dot-strip {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 200; display: flex; gap: 9px; align-items: center;
        }
        .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(32, 145, 128,0.2);
            transition: all .4s; cursor: pointer; border: none;
            padding: 0;
        }
        .dot.active {
            background: var(--petrol);
            box-shadow: 0 0 10px var(--petrol);
            width: 22px; border-radius: 4px;
        }

        #drag-hint {
            position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%);
            z-index: 200; font-size: 9px; letter-spacing: 4px;
            color: rgba(255,255,255,0.3); text-transform: uppercase;
            pointer-events: none; white-space: nowrap;
            animation: hintFade 4s ease forwards 1.5s;
        }
        @keyframes hintFade { 0%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }

        #bottom-atmo {
            position: fixed; bottom: 0; left: 0; right: 0; height: 160px;
            background: linear-gradient(transparent, rgba(2,2,5,0.9));
            pointer-events: none; z-index: 90;
        }
    
    </style>
</head>
<body>

    <!-- MENÚ ACTUALIZADO -->
    <nav id="staff-nav">
        <span class="nav-logo">NYLON</span>
        <div class="nav-links">
            <a href="index.html#main-video">Inicio</a>
            <a href="somos.html">Somos</a>
            <a href="servicios.html">Servicios</a>
            <a href="contacto.html">Contacto</a>
        </div>
    </nav>

    <!-- ESTRELLAS Y HUD -->
    <canvas id="starfield"></canvas>
    <div class="hud-vignette"></div>
    <div id="bottom-atmo"></div>

    <div id="sector-hud">
        <div id="sector-index">01</div>
        <div id="sector-name">CARGANDO...</div>
    </div>

    <!-- ESCENARIO DEL CARRUSEL -->
    <div id="stage">
        <div id="carousel"></div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <div id="drag-hint">[ DESLIZA PARA EXPLORAR ]</div>
    <div id="dot-strip"></div>

    <script>
    (function(){
        
        // ARRAY ACTUALIZADO (6 Proyectos iguales a PC)
        const PROJECTS = [
            { title: 'Periodismo - Host', tag: 'Talent',       video: 'videos/host.mp4',             link: 'host.html' },
            { title: 'Brand Experience',  tag: 'Estrategia',   video: 'videos/trailermarcas.mp4',    link: 'holo.html' },
            { title: 'Cont. Audiovisual', tag: 'Producción',   video: 'videos/trailer comercial.mp4',link: 'comercial.html' },
            { title: 'Diseño Gráfico',    tag: 'Diseño',       video: 'videos/miniaturadiseno.mp4',  link: 'ugc.html' },
            { title: 'Eventos',           tag: 'Cobertura',    video: 'videos/sport.mp4',            link: 'deportes.html' },
            { title: 'Drone Works',       tag: 'Drone Pilot',  video: 'videos/miniaturadron.mp4',    link: 'eventos.html' }
        ];

        const N = PROJECTS.length;

        const carousel    = document.getElementById('carousel');
        const dotStrip    = document.getElementById('dot-strip');
        const sectorName  = document.getElementById('sector-name');
        const sectorIndex = document.getElementById('sector-index');

        let activeIdx    = 0;
        let dragOffset   = 0;
        let isDragging   = false;

        const GAP = 28;

        function getCardW() {
            return carousel.offsetWidth;
        }

        function positionCards(dragDeltaX) {
            const cw = getCardW() + GAP;
            cards.forEach((card, i) => {
                let dist = i - activeIdx;

                if (dist > N / 2)  dist -= N;
                if (dist < -N / 2) dist += N;

                const targetX = dist * cw + (dragDeltaX || 0);
                const absD    = Math.abs(dist);

                const scale   = isDragging ? 1 : (absD === 0 ? 1 : 0.88);
                const opacity = absD === 0 ? 1 : absD === 1 ? 0.45 : 0.15;
                const zIndex  = absD === 0 ? 10 : absD === 1 ? 5 : 1;

                if (isDragging) {
                    card.style.transition = 'none';
                } else {
                    card.style.transition = 'transform .38s cubic-bezier(.25,.46,.45,.94), opacity .38s ease, box-shadow .5s, border-color .5s';
                }
                card.style.transform = `translateX(${targetX}px) scale(${scale})`;
                card.style.opacity   = opacity;
                card.style.zIndex    = zIndex;
            });
        }

        const cards = PROJECTS.map((p, i) => {
            const card = document.createElement('div');
            card.className = 'orb-card';

            card.innerHTML = `
                <div class="card-media">
                    <video src="${p.video}" loop muted playsinline preload="auto"></video>
                </div>
                <div class="card-info">
                    <div class="card-title">${p.title}</div>
                    <div class="card-tag">${p.tag}</div>
                    <div class="card-cta">[ VER PROYECTO ]</div>
                </div>`;

            let tStartX = 0, tStartY = 0;

            card.addEventListener('touchstart', (e) => {
                tStartX = e.touches[0].clientX;
                tStartY = e.touches[0].clientY;
                onDragStart(tStartX);
            }, { passive: true });
            
            card.addEventListener('touchmove', (e) => {
                const currentX = e.touches[0].clientX;
                onDragMove(currentX);
            }, { passive: true });

            card.addEventListener('touchend', (e) => {
                onDragEnd();
                if (i !== activeIdx) return;
                const dx = Math.abs(e.changedTouches[0].clientX - tStartX);
                const dy = Math.abs(e.changedTouches[0].clientY - tStartY);
                if (dx < 8 && dy < 8) {
                    setTimeout(() => { window.location.href = p.link; }, 80);
                }
            }, { passive: true });

            carousel.appendChild(card);
            return card;
        });

        const dots = PROJECTS.map((_, i) => {
            const btn = document.createElement('button');
            btn.className = 'dot';
            btn.addEventListener('click', () => goTo(i));
            dotStrip.appendChild(btn);
            return btn;
        });

        function goTo(idx) {
            activeIdx = ((idx % N) + N) % N;
            updateHUD();
            positionCards(0);
            updateVideoPlayback();
        }

        function updateVideoPlayback() {
            cards.forEach((card, i) => {
                const video = card.querySelector('video');
                if (video) {
                    if (i === activeIdx) {
                        video.play().catch(e => console.log("Autoplay prevenido por navegador"));
                    } else {
                        video.pause();
                    }
                }
            });
        }

        function updateHUD() {
            dots.forEach((d, i)  => d.classList.toggle('active', i === activeIdx));
            cards.forEach((c, i) => c.classList.toggle('active', i === activeIdx));
            sectorName.textContent  = PROJECTS[activeIdx].title.toUpperCase();
            sectorIndex.textContent = String(activeIdx + 1).padStart(2, '0');
        }

        positionCards(0);
        updateHUD();
        updateVideoPlayback();

        let dragStartX = 0;

        function onDragStart(x) {
            isDragging  = true;
            dragStartX  = x;
            dragOffset  = 0;
            boostWarp();
        }

        function onDragMove(x) {
            if (!isDragging) return;
            dragOffset = x - dragStartX;
            positionCards(dragOffset);
            boostWarp();
        }

        function onDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            const cw = getCardW() + GAP;
            const threshold = cw * 0.25;

            if (dragOffset < -threshold) goTo(activeIdx + 1);
            else if (dragOffset > threshold) goTo(activeIdx - 1);
            else positionCards(0);
            
            dragOffset = 0;
        }

        // --- SISTEMA DE ESTRELLAS (REUTILIZADO DE PC) ---
        const canvas = document.getElementById('starfield');
        const ctx    = canvas.getContext('2d');
        let W, H, stars = [], warp = 1, targetWarp = 1, warpTimer;

        function initStars() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
            stars = Array.from({ length: 300 }, () => ({
                x: Math.random() * W - W / 2,
                y: Math.random() * H - H / 2,
                z: Math.random() * W,
            }));
        }

        function drawStars() {
            warp += (targetWarp - warp) * 0.10;
            ctx.fillStyle = 'rgba(0,0,0,0.42)';
            ctx.fillRect(0, 0, W, H);
            for (let s of stars) {
                s.z -= warp;
                if (s.z <= 0) { s.x = Math.random() * W - W/2; s.y = Math.random() * H - H/2; s.z = W; }
                const sx = W/2 + (s.x/s.z)*W, sy = H/2 + (s.y/s.z)*W;
                const r = Math.max(0, (1-s.z/W)*2.4), alpha = Math.min(1,(1-s.z/W)*2.2);
                const mix = Math.min(1,(warp-1)/25);
                ctx.fillStyle = `rgba(${Math.round(200-mix*170)},${Math.round(210+mix*20)},${Math.round(215+mix*30)},${alpha})`;
                ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
            }
            requestAnimationFrame(drawStars);
        }

        function boostWarp() {
            targetWarp = 30;
            clearTimeout(warpTimer);
            warpTimer = setTimeout(() => { targetWarp = 1; }, 200);
        }

        window.addEventListener('resize', () => { initStars(); positionCards(0); });
        initStars();
        drawStars();

    })();
    </script>
</body>
</html>
