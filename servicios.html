const PLANET_VERT = `
varying vec3 vPos;
varying vec3 vNormal;
varying vec3 vViewDir;
varying vec3 vWorldPos;

void main() {
  vPos = position; 
  vNormal = normalize(normalMatrix * normal);

  vec4 worldPosition = modelMatrix * vec4(position, 1.0);
  vWorldPos = worldPosition.xyz;
  
  vec4 mvPos = viewMatrix * worldPosition;
  vViewDir = normalize(-mvPos.xyz);
  
  gl_Position = projectionMatrix * mvPos;
}`;

const PLANET_FRAG = `
uniform float uTime;
uniform vec3 uC1, uC2, uC3;
uniform float uHover, uSeed;

varying vec3 vPos;
varying vec3 vNormal;
varying vec3 vViewDir;
varying vec3 vWorldPos;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise3D(vec3 x) {
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                 mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                 mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}

float fbm3D(vec3 p) {
  float f = 0.0; float amp = 0.5;
  for(int i = 0; i < 5; i++) {
    f += amp * noise3D(p);
    p *= 2.01; amp *= 0.5;
  }
  return f;
}

void main() {

  float t = uTime * 0.1;
  vec3 p = vPos * 2.5 + vec3(t, t*0.5, 0.0) + uSeed;

  float base = fbm3D(p);
  float mid = fbm3D(p * 2.2 + base);
  float micro = fbm3D(p * 5.0 + mid);

  float land = smoothstep(0.4, 0.6, base);
  vec3 col = mix(uC3, uC1, land); 
  col = mix(col, uC2, micro * 0.5 * land); 


  vec3 lightDir = normalize(vec3(0.0) - vWorldPos); 
  float nDotL = max(dot(vNormal, lightDir), 0.0);

  float shadow = smoothstep(0.0, 0.25, nDotL);

  float bump = (micro - 0.5) * 0.3 * land;
  float litBump = max(nDotL + bump, 0.0);

  float fresnel = pow(1.0 - max(dot(vNormal, vViewDir), 0.0), 2.5);

  vec3 reflection = reflect(-lightDir, vNormal);
  float spec = pow(max(dot(vViewDir, reflection), 0.0), 28.0);

  vec3 finalCol = col * (litBump * shadow + 0.08);
  finalCol += (uC1 * 0.8 + uC2 * 0.2) * fresnel * (nDotL + 0.1);
  finalCol += vec3(0.9, 0.9, 1.0) * spec * 0.7 * shadow;
  finalCol += uC2 * uHover * fresnel * 1.5;

  gl_FragColor = vec4(finalCol, 1.0);
}`;

const ATMOS_VERT = `
varying vec3 vNormal;
varying vec3 vViewDir;
varying vec3 vWorldPos;
void main(){
  vNormal = normalize(normalMatrix * normal);
  vec4 worldPosition = modelMatrix * vec4(position, 1.0);
  vWorldPos = worldPosition.xyz;
  vec4 mv = viewMatrix * worldPosition;
  vViewDir = normalize(-mv.xyz);
  gl_Position = projectionMatrix * mv;
}`;

const ATMOS_FRAG = `
uniform vec3 uColor;
uniform float uAlpha;
varying vec3 vNormal;
varying vec3 vViewDir;
varying vec3 vWorldPos;
void main(){

  vec3 lightDir = normalize(vec3(0.0) - vWorldPos);
  float nDotL = max(dot(vNormal, lightDir), 0.0);

  float rim = pow(1.0 - clamp(dot(vNormal, vViewDir), 0.0, 1.0), 2.5);

  float intensity = rim * (nDotL + 0.1) * uAlpha * 1.5;

  gl_FragColor = vec4(uColor, intensity);
}`;

const CLOUD_VERT = `
varying vec3 vPos;
varying vec3 vNormal;
varying vec3 vViewDir;
varying vec3 vWorldPos;
void main() {
  vPos = position;
  vNormal = normalize(normalMatrix * normal);
  vec4 worldPosition = modelMatrix * vec4(position, 1.0);
  vWorldPos = worldPosition.xyz;
  vec4 mvPos = viewMatrix * worldPosition;
  vViewDir = normalize(-mvPos.xyz);
  gl_Position = projectionMatrix * mvPos;
}`;

const CLOUD_FRAG = `
uniform float uTime;
uniform vec3 uColor;
uniform float uSeed;

varying vec3 vPos;
varying vec3 vNormal;
varying vec3 vViewDir;
varying vec3 vWorldPos;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1); p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float noise3D(vec3 x) {
  vec3 i = floor(x); vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                 mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                 mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm3D(vec3 p) {
  float f = 0.0; float amp = 0.5;
  for(int i = 0; i < 4; i++) {
    f += amp * noise3D(p); p *= 2.01; amp *= 0.5;
  }
  return f;
}

void main() {
  float t = uTime * 0.15;
  vec3 p = vPos * 3.0 + vec3(t*0.8, 0.0, -t) + uSeed;

  float clouds = fbm3D(p);

  clouds = smoothstep(0.45, 0.7, clouds); 

  vec3 lightDir = normalize(vec3(0.0) - vWorldPos);
  float nDotL = max(dot(vNormal, lightDir), 0.0);

  float fresnel = 1.0 - max(dot(vNormal, vViewDir), 0.0);
  float alpha = clouds * (nDotL * 0.8 + 0.2) * (1.0 - pow(fresnel, 3.0));

  gl_FragColor = vec4(uColor, alpha * 0.65);
}`;

const STAR_VERT=`attribute float aSize;attribute vec3 aColor;attribute float aPhase;uniform float uTime;varying vec3 vColor;void main(){vColor=aColor;float tw=.5+.5*sin(uTime*2.+aPhase*6.28);vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*(0.7+0.3*tw)*300./(-mv.z);gl_Position=projectionMatrix*mv;}`;
const STAR_FRAG=`varying vec3 vColor;void main(){vec2 uv=gl_PointCoord-.5;float d=length(uv);if(d>.5)discard;gl_FragColor=vec4(vColor,pow(1.-d*2.,2.));}`;

function animate(currentTime) {
  // Actualizar uniforms de tiempo
  if (window._stars && window._stars.material.uniforms) {
    window._stars.material.uniforms.uTime.value += 0.01;
  }
  
  // Rotación de planetas (solo si planetMeshes existe)
  if (typeof planetMeshes !== 'undefined') {
    planetMeshes.forEach((mesh, i) => {
      mesh.rotation.y += 0.002;
      if (mesh.children) {
        mesh.children.forEach(child => {
          if (child.material && child.material.uniforms) {
            child.material.uniforms.uTime.value += 0.01;
          }
        });
      }
    });
  }
  
  renderer.render(scene, camera);
}

if (ThreeJSRenderManager) {
  renderManager = new ThreeJSRenderManager(canvas3d, animate, {
    targetFPS: DeviceCapabilities?.getTargetFPS?.() || (IS_MOBILE ? 30 : 60),
    threshold: 0.1
  });
} else {
  // Fallback manual
  let isRendering = true;
  let animationFrameId;
  
  function toggleRendering(shouldRender) {
    if (shouldRender && !isRendering) {
      isRendering = true;
      animationFrameId = requestAnimationFrame(animate);
    } else if (!shouldRender && isRendering) {
      isRendering = false;
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }
  }
  
  // Intersection Observer
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => toggleRendering(entry.isIntersecting));
    }, { threshold: 0.1 });
    observer.observe(canvas3d);
  }
  
  // Visibility API
  document.addEventListener('visibilitychange', () => {
    toggleRendering(!document.hidden);
  });
  
  // Iniciar animación
  requestAnimationFrame(animate);
}

let orbitLine, orbitDots;
function buildOrbitRing(orx,orz){
  if(orbitLine) scene.remove(orbitLine);
  if(orbitDots) scene.remove(orbitDots);
  const pts=[];
  for(let i=0;i<=180;i++){
    const a=i/180*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*orx,0,Math.sin(a)*orz));
  }
  orbitLine=new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0x05D7DA,transparent:true,opacity:.12,blending:THREE.AdditiveBlending})
  );
  scene.add(orbitLine);

  const dp=[];
  for(let i=0;i<80;i++){const a=i/80*Math.PI*2;dp.push(Math.cos(a)*orx,0,Math.sin(a)*orz);}
  const dg=new THREE.BufferGeometry();
  dg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(dp),3));
  orbitDots=new THREE.Points(dg,new THREE.PointsMaterial({color:0x05D7DA,size:.05,transparent:true,opacity:.22,blending:THREE.AdditiveBlending}));
  scene.add(orbitDots);
}

        if(Math.abs(t.clientX-touchStartX)>8||Math.abs(t.clientY-touchStartY)>8) touchMoved=true;
        mouse.x=(t.clientX/window.innerWidth)*2-1;
        mouse.y=-(t.clientY/window.innerHeight)*2+1;
        if(touchMoved && mobileHUD.classList.contains('visible')) hideMobileHUD();
      } catch (error) {
        console.warn('Touch move handler failed:', error);
      }
    },{passive:true});

    canvas3d.addEventListener('touchend',e=>{
      try {
        if(!touchMoved && hoveredPlanet && !selectedPlanet) openPortal(hoveredPlanet, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      } catch (error) {
        console.warn('Touch end handler failed:', error);
      }
    });

    function findOrbitTimeline() {
      try {
        if (typeof gsap !== 'undefined') {

          const animations = gsap.getTweensOf(planets);
          animations.forEach(tween => {
            if (tween.vars.onUpdate && tween.vars.onUpdate.toString().includes('angle')) {
              orbitTimeline = tween;
            }
          });
        }
      } catch (error) {
        console.warn('findOrbitTimeline failed:', error);
      }
    }

    findOrbitTimeline();
    if (typeof gsap !== 'undefined') {
      gsap.set(mobileHUD, { y: '100%' });
    } else {
      mobileHUD.style.transform = 'translateY(100%)';
    }
  } catch (error) {
    console.error('Mobile HUD initialization failed:', error);
  }
}

canvas3d.addEventListener('touchend',e=>{
  const t=e.changedTouches[0];
  mouse.x=(t.clientX/window.innerWidth)*2-1;
  mouse.y=-(t.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(planetMeshes);
  if(hits.length>0){
    const idx=planetMeshes.indexOf(hits[0].object);
    if(idx>-1) openPortal(planets[idx],t.clientX,t.clientY);
  }
},{passive:true});

document.addEventListener('click',e=>{
  if(e.target&&e.target.id==='panel-close') closePanel();
});



const portalCanvas=document.getElementById('portal-canvas');
const portalCtx=portalCanvas.getContext('2d');

function hexToRgb(hex){
  return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)].join(',');
}

class StarDust{
  constructor(x,y,rgb,acc){
    this.x=x;this.y=y;this.rgb=rgb;this.acc=acc;
    this.vx=(Math.random()-.5)*6;this.vy=(Math.random()-.5)*6-2;
    this.life=1+Math.random();this.decay=.013+Math.random()*.018;
    this.size=Math.random()*2.5+.4;
    this.type=Math.floor(Math.random()*3);
    this.ang=Math.random()*Math.PI*2;this.spin=(Math.random()-.5)*.2;
    this.grav=.05+Math.random()*.07;
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;
    this.vy+=this.grav;this.vx*=.97;
    this.life-=this.decay;this.ang+=this.spin;this.size*=.993;
  }
  draw(ctx){
    if(this.life<=0)return;
    const a=Math.min(this.life,1);
    ctx.save();ctx.globalAlpha=a;ctx.translate(this.x,this.y);ctx.rotate(this.ang);
    if(this.type===0){
      ctx.shadowColor=`rgba(${this.rgb},1)`;ctx.shadowBlur=this.size*2.5;
      ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);
      ctx.fillStyle=`rgba(${this.acc},${a})`;ctx.fill();
    }else if(this.type===1){
      ctx.strokeStyle=`rgba(${this.rgb},${a})`;ctx.lineWidth=.7;
      ctx.shadowColor=`rgba(${this.rgb},1)`;ctx.shadowBlur=5;
      const s=this.size*2.2;
      ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(0,s);ctx.moveTo(-s*.4,0);ctx.lineTo(s*.4,0);ctx.stroke();
    }else{
      ctx.strokeStyle=`rgba(${this.rgb},${a*.6})`;ctx.lineWidth=this.size*.5;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-this.vx*3,-this.vy*3);ctx.stroke();
    }
    ctx.restore();
  }
}

let portalParticles=[];

function openPortal(planet,sx,sy){
  if(selectedPlanet)return;
  selectedPlanet=planet;
  const s=planet.service;
  const rgb=hexToRgb(s.hex),rgbL=hexToRgb(s.hexLight);
  portalCanvas.width=window.innerWidth;portalCanvas.height=window.innerHeight;
  portalCanvas.style.display='block';portalCanvas.style.pointerEvents='none';

  const maxR=Math.hypot(Math.max(sx,window.innerWidth-sx),Math.max(sy,window.innerHeight-sy))*1.2;
  let radius=planet.service.size*26,t=0,done=false;
  portalParticles=[];
  for(let i=0;i<60;i++) portalParticles.push(new StarDust(sx+(Math.random()-.5)*radius*.5,sy+(Math.random()-.5)*radius*.5,rgb,rgbL));

  function drawPortal(){
    portalCtx.clearRect(0,0,portalCanvas.width,portalCanvas.height);
    portalCtx.save();

    for(let b=0;b<3;b++){
      const ph=b*(Math.PI*2/3);
      portalCtx.beginPath();
      for(let i=0;i<=100;i++){
        const ang=i/100*Math.PI*2,w=radius*.11;
        const r=radius+Math.sin(ang*3+t*4+ph)*w*.6+Math.sin(ang*5-t*3+ph*1.5)*w*.4
                +Math.sin(ang*7+t*6+ph*2)*w*.22+Math.sin(ang*2+t*2.5)*w*(.28+b*.08)
                +Math.cos(ang*4-t*3.2)*w*(.18-b*.04);
        const px=sx+Math.cos(ang)*r,py=sy+Math.sin(ang)*r;
        i===0?portalCtx.moveTo(px,py):portalCtx.lineTo(px,py);
      }
      portalCtx.closePath();
      if(b===0){
        const g=portalCtx.createRadialGradient(sx,sy,0,sx,sy,radius*1.2);
        g.addColorStop(0,'rgba(0,5,16,.95)');g.addColorStop(.3,`rgba(${rgb},.3)`);
        g.addColorStop(.7,`rgba(${rgb},.1)`);g.addColorStop(1,`rgba(${rgb},0)`);
        portalCtx.fillStyle=g;portalCtx.fill();
      }
      portalCtx.strokeStyle=`rgba(${rgb},${.58-b*.14})`;
      portalCtx.lineWidth=2.8-b*.6;portalCtx.shadowColor=s.hex;portalCtx.shadowBlur=18+b*7;
      portalCtx.stroke();portalCtx.shadowBlur=0;
    }

    for(let ri=1;ri<=4;ri++){
      portalCtx.save();portalCtx.translate(sx,sy);portalCtx.rotate(t*(ri%2?1:-1)*.28);
      portalCtx.beginPath();
      const rr=radius*(.12+ri*.13);
      for(let i=0;i<=50;i++){const ang=i/50*Math.PI*2,w=rr*(1+Math.sin(ang*4+t*5+ri)*.04);portalCtx.lineTo(Math.cos(ang)*w,Math.sin(ang)*w);}
      portalCtx.closePath();portalCtx.strokeStyle=`rgba(${rgb},${(.22-ri*.04)*Math.min(1,t*3)})`;portalCtx.lineWidth=.7;portalCtx.stroke();portalCtx.restore();
    }

    for(let ti=0;ti<6;ti++){
      const ba=(ti/6)*Math.PI*2+t*.4,tl=radius*(.13+Math.sin(t*3+ti)*.07);
      portalCtx.beginPath();
      portalCtx.moveTo(sx+Math.cos(ba)*radius,sy+Math.sin(ba)*radius);
      portalCtx.quadraticCurveTo(sx+Math.cos(ba-.1)*(radius+tl*.5),sy+Math.sin(ba-.1)*(radius+tl*.5),sx+Math.cos(ba+.14)*(radius+tl),sy+Math.sin(ba+.14)*(radius+tl));
      portalCtx.strokeStyle=`rgba(${rgb},${.28*Math.min(1,t*4)})`;portalCtx.lineWidth=1.2+Math.sin(t*4+ti)*.4;
      portalCtx.shadowColor=s.hex;portalCtx.shadowBlur=7;portalCtx.stroke();portalCtx.shadowBlur=0;
    }
    portalCtx.restore();

    if(!done&&t<2.5){
      const rate=Math.floor(2+radius*.03);
      for(let i=0;i<rate;i++){
        const a=Math.random()*Math.PI*2,r=radius*(.7+Math.random()*.5);
        portalParticles.push(new StarDust(sx+Math.cos(a)*r,sy+Math.sin(a)*r,rgb,rgbL));
      }
    }
    portalParticles=portalParticles.filter(p=>p.life>0);
    portalParticles.forEach(p=>{p.update();p.draw(portalCtx);});

    if(!done){
      radius+=(maxR-radius)*.065+3;t+=.05;
      if(radius>=maxR*.9){
        done=true;

        let ct=0;const startR=radius;
        const targetR=Math.max(Math.min(600,window.innerWidth-32),300)*.52;
        function contractBlob(){
          portalCtx.clearRect(0,0,portalCanvas.width,portalCanvas.height);
          const ease=1-Math.pow(1-Math.min(ct/55,1),3);
          const curR=startR+(targetR-startR)*ease;
          const turb=Math.max(0,1-ct/38);
          const bg=Math.max(0,.72-ct*.016);
          portalCtx.fillStyle=`rgba(0,5,16,${bg})`;
          portalCtx.fillRect(0,0,portalCanvas.width,portalCanvas.height);
          portalCtx.save();portalCtx.beginPath();
          for(let i=0;i<=90;i++){
            const ang=i/90*Math.PI*2,w=curR*(.07*turb+.018);
            const r=curR+Math.sin(ang*3+t*4)*w*.55*turb+Math.sin(ang*5-t*3)*w*.38*turb
                    +Math.cos(ang*7+t*6)*w*.18*turb+Math.sin(ang*2+t*2)*w*.28;
            portalCtx.lineTo(sx+Math.cos(ang)*r,sy+Math.sin(ang)*r);
          }
          portalCtx.closePath();
          const g2=portalCtx.createRadialGradient(sx,sy,0,sx,sy,curR);
          g2.addColorStop(0,`rgba(0,6,18,${Math.min(.95,.28+ease*.67)})`);
          g2.addColorStop(.5,`rgba(${rgb},.1)`);g2.addColorStop(1,`rgba(${rgb},0)`);
          portalCtx.fillStyle=g2;portalCtx.fill();
          portalCtx.strokeStyle=`rgba(${rgb},${.38+ease*.62})`;
          portalCtx.lineWidth=2+ease*2.5;portalCtx.shadowColor=s.hex;portalCtx.shadowBlur=14+ease*28;
          portalCtx.stroke();portalCtx.shadowBlur=0;portalCtx.restore();
          portalParticles=portalParticles.filter(p=>p.life>0);
          portalParticles.forEach(p=>{p.update();p.draw(portalCtx);});
          t+=.04;ct++;
          ct<60?requestAnimationFrame(contractBlob):showPanel(s,sx,sy,rgb,rgbL);
        }
        contractBlob();return;
      }
      requestAnimationFrame(drawPortal);
    }
  }
  drawPortal();
}

function showPanel(s,sx,sy,rgb,rgbL){
  const panel=document.getElementById('service-panel');
  const content=document.getElementById('panel-content');
  content.classList.remove('revealed');
  content.style.setProperty('--accent-col',s.hex);
  document.getElementById('panel-tag').textContent=s.tag;
  document.getElementById('panel-title').textContent=s.title;
  document.getElementById('panel-copy').textContent=s.copy;
  content.scrollTop=0;
  panel.style.display='flex';

  const cxOff=sx-window.innerWidth/2,cyOff=sy-window.innerHeight/2;
  content.style.transition='none';
  content.style.transform=`translate(${cxOff}px,${cyOff}px) scale(0.04)`;
  content.style.opacity='0';content.style.filter='blur(20px)';

  let et=0;
  function expandSync(){
    portalCtx.clearRect(0,0,portalCanvas.width,portalCanvas.height);
    const ease=1-Math.pow(1-Math.min(et/50,1),3);
    const gr=Math.max(18,(1-ease)*260);
    const ga=(1-ease)*.65;
    const g=portalCtx.createRadialGradient(sx,sy,0,sx,sy,gr);
    g.addColorStop(0,`rgba(${rgb},${ga})`);g.addColorStop(.6,`rgba(${rgb},${ga*.3})`);g.addColorStop(1,`rgba(${rgb},0)`);
    portalCtx.beginPath();portalCtx.arc(sx,sy,gr,0,Math.PI*2);portalCtx.fillStyle=g;portalCtx.fill();
    portalParticles=portalParticles.filter(p=>p.life>0);
    portalParticles.forEach(p=>{p.update();p.draw(portalCtx);});
    et++;
    if(et<55){requestAnimationFrame(expandSync);}
    else{
      portalCanvas.style.transition='opacity .4s';portalCanvas.style.opacity='0';
      setTimeout(()=>{portalCanvas.style.display='none';portalCanvas.style.opacity='1';portalCanvas.style.transition='';},400);
    }
  }

  requestAnimationFrame(()=>{
    content.style.transition='transform .65s cubic-bezier(.16,1,.3,1),opacity .5s ease,filter .55s ease';
    content.style.transform='translate(0,0) scale(1)';
    content.style.opacity='1';content.style.filter='blur(0px)';
    setTimeout(()=>{
      content.classList.add('revealed');
      const btn=document.getElementById('panel-close');
      btn.style.borderColor=s.hex;btn.style.color=s.hex;
      btn.style.setProperty('--panel-accent',s.hex);
      btn.style.display='block';
    },200);
    expandSync();
  });
}

function closePanel(){
  const panel=document.getElementById('service-panel');
  const content=document.getElementById('panel-content');
  document.getElementById('panel-close').style.display='none';
  content.classList.remove('revealed');
  content.style.transition='transform .45s cubic-bezier(.7,0,.84,0),opacity .35s ease .1s,filter .4s ease';
  content.style.transform='scale(0.05)';content.style.opacity='0';content.style.filter='blur(14px)';
  setTimeout(()=>{
    panel.style.display='none';
    content.style.cssText='';
    portalCanvas.style.display='none';
    selectedPlanet=null;
  },480);
}



const clock=new THREE.Clock();
let time=0,pageVisible=true;

document.addEventListener('visibilitychange',()=>{pageVisible=!document.hidden;});

let lp=0;
const loader=document.getElementById('loader');
const li=setInterval(()=>{
  lp+=Math.random()*14;
  if(lp>=100){lp=100;clearInterval(li);
    setTimeout(()=>{loader.style.opacity='0';setTimeout(()=>loader.style.display='none',800);},300);
  }
},100);

setTimeout(() => {
  if (loader && loader.style.opacity !== '0' && loader.style.display !== 'none') {
    console.warn('FAILSAFE ACTIVADO: Forzando ocultaci�n del loader despu�s de 3500ms');
    loader.style.opacity = '0';
    loader.style.pointerEvents = 'none';
    setTimeout(() => {
      loader.style.display = 'none';
    }, 800);

    if (li) clearInterval(li);
  }
}, 3500);

function animate(){
  requestAnimationFrame(animate);
  if(!pageVisible) return;

  const dt=Math.min(clock.getDelta()*1000,50);
  time+=dt;
  const t=time*.001;

  window._stars.material.uniforms.uTime.value=t;
  sunMat.uniforms.uTime.value=t;
  sun.rotation.y+=.003;

  if(!selectedPlanet){
    cameraSwayT+=dt*.00028;
    camera.position.x=Math.sin(cameraSwayT)*vc.sway;
    camera.position.y=vc.camY+Math.cos(cameraSwayT*.7)*.45;
    camera.lookAt(0,0,0);
  }

  if(!labelHoverActive){
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects(planetMeshes);
    const nowH=hits.length>0?planets[planetMeshes.indexOf(hits[0].object)]:null;
    if(nowH!==hoveredPlanet){
      hoveredPlanet=nowH;
      canvas3d.style.cursor=hoveredPlanet?'pointer':'crosshair';
    }
  }

  const sunLabel = document.getElementById('sun-label');
  const sunSP = getScreenPos(sun);
  sunLabel.style.left = sunSP.x + 'px';
  sunLabel.style.top = sunSP.y + 'px';
  sunLabel.style.marginTop = IS_MOBILE ? '-150px' : '-190px';
  const mobileHUDVisible = IS_MOBILE && document.getElementById('mobile-hud').classList.contains('visible');
  if(selectedPlanet || mobileHUDVisible){
    sunLabel.style.opacity = '0';
  } else {

    sunLabel.style.opacity = hoveredPlanet ? '0.35' : '0.85';
  }


  let anyPaused=false;
  planets.forEach((p,i)=>{

    if (!p || !p.mesh || !p.mat || !p.cloudMat || !p.service) return;
    
    const s=p.service;
    const FMIN=Math.PI/2-.4,FMAX=Math.PI/2+.4;
    const norm=((p.angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const inZone=norm>FMIN&&norm<FMAX;
    if(inZone&&!p.wasInZone){p.wasInZone=true;p.state='PAUSED';p.pauseTimer=0;}
    if(!inZone) p.wasInZone=false;

    let spd=1;
    if(p.state==='PAUSED'){
      p.pauseTimer+=dt;spd=0;anyPaused=true;
      if(p.pauseTimer>p.pauseDuration){p.state='ORBITING';p.wasInZone=true;}
    }

    p.angle+=p.orbitSpeed*spd*(dt*.001*60);
    p.mesh.position.set(Math.cos(p.angle)*vc.orx,0,Math.sin(p.angle)*vc.orz);
    p.mesh.rotation.y+=p.spinSpeed;

    const th=(p===hoveredPlanet)?1:0;
    p.hoverAnim+=(th-p.hoverAnim)*.08;
    p.mat.uniforms.uHover.value=p.hoverAnim;
    p.mat.uniforms.uTime.value=t+i*.7;
    p.cloudMat.uniforms.uTime.value=t+i*.7;


    const baseScale = IS_MOBILE ? 0.9 : 1.3; 
    const ts = baseScale + (p === hoveredPlanet ? 0.15 : 0);
    p.scaleAnim += (ts - p.scaleAnim) * 0.1;
    p.mesh.scale.setScalar(p.scaleAnim);

    const sp = getScreenPos(p.mesh);


    const perspectiveScale = 25 / sp.dist; 

    const baseOffsetY = IS_MOBILE ? (s.size * 25) + 10 : (s.size * 70) + 10; 
    const offsetY = baseOffsetY * perspectiveScale;
    
    p.labelEl.style.left = sp.x + 'px';
    p.labelEl.style.top = (sp.y - offsetY) + 'px';

    const isActive = (p.state === 'PAUSED') || (p === hoveredPlanet);
    
    if (isActive) {
        p.labelEl.style.opacity = '1';
        p.labelEl.style.transform = `translate(-50%, -50%) scale(${perspectiveScale * 1.15})`;
        p.labelEl.style.zIndex = '160';
    } else {
        p.labelEl.style.opacity = '0.75';
        p.labelEl.style.transform = `translate(-50%, -50%) scale(${perspectiveScale})`;

        p.labelEl.style.zIndex = Math.floor(150 - sp.dist);
    }

  });
  
  if (window._stars && window._stars.rotation) {
    window._stars.rotation.y+=.00004;
  }
  renderer.render(scene,camera);
}



// Cleanup de memoria al cambiar de página
window.addEventListener('beforeunload', () => {
  // Detener render manager
  if (renderManager) {
    renderManager.dispose();
    renderManager = null;
  }
  
  // Limpiar geometrías y materiales usando MemoryCleaner
  if (MemoryCleaner) {
    MemoryCleaner.disposeScene(scene);
    MemoryCleaner.disposeRenderer(renderer);
  } else {
    // Fallback manual
    scene.traverse((object) => {
      if (object.geometry) object.geometry.dispose();
      if (object.material) {
        if (Array.isArray(object.material)) {
          object.material.forEach(mat => mat.dispose());
        } else {
          object.material.dispose();
        }
      }
    });
    renderer.dispose();
    renderer.forceContextLoss();
  }
  
  console.log('🧹 Three.js memory cleaned up');
});

// Resize con debounce (usando utilidad global si está disponible)
const debounceFn = debounce || ((fn, wait) => {
  let timeout;
  return (...args) => {
    clearTimeout(timeout);
    timeout = setTimeout(() => fn.apply(this, args), wait);
  };
});

let resizeTimeout;
window.addEventListener('resize', debounceFn(() => {
  vc=getViewConfig();
  if (camera) {
    camera.fov=vc.fov;
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    camera.position.set(0,vc.camY,vc.camZ);
  }
  if (renderer) {
    renderer.setSize(window.innerWidth,window.innerHeight);
  }
  buildOrbitRing(vc.orx,vc.orz);

  planets.forEach(p=>{
    if (p && p.mesh) {
      p.mesh.position.set(Math.cos(p.angle)*vc.orx,0,Math.sin(p.angle)*vc.orz);
    }
  });
}, 150), { passive: true });

// Iniciar animación solo si renderManager no está activo
if (!renderManager) {
  animate();
}
