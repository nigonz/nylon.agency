<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYLON — Contenido Comercial</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Playfair+Display:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root{
      --teal: #00756c;
      --teal-light: #02968d;
      --cyan: #00756d;
      --bg:#020208;
      --bg2:#030410;
      --text:rgba(255,255,255,0.88);
      --text-dim:rgba(255,255,255,0.35);
      --petrol:#0a5f73;
      --gradient-primary:linear-gradient(135deg,#0a0a0f 0%,#1a1a2e 100%);
    }

    html{scroll-behavior:smooth}
    body{
      font-family:'Space Grotesk',sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      min-height:100vh;
    }

    /* ═══════════════════════════════════════════
       FONDO ANIMADO (ESTRELLAS + COMETAS)
    ═══════════════════════════════════════════ */
    #bgCanvas{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
    }

    body::before,body::after{
      content:'';
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
    }

    body::before{
      background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(35,8,110,0.24) 0%,transparent 68%);
      animation:nd 36s ease-in-out infinite alternate;
    }

    body::after{
      background:radial-gradient(ellipse at 80% 70%,rgba(8,25,120,0.18) 0%,transparent 68%);
      animation:nb 42s ease-in-out infinite alternate-reverse;
    }

    @keyframes nd{0%{transform:translate(0,0) scale(1)}100%{transform:translate(32px,22px) scale(1.10)}}
    @keyframes nb{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-28px,-18px) scale(1.08)}}

    /* ═══════════════════════════════════════════
       NAVEGACIÓN
    ═══════════════════════════════════════════ */
    nav{
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      width:92%;
      max-width:1200px;
      z-index:200;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:15px 30px;
      background:rgba(5,5,12,0.55);
      backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:40px;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    .logo{
      font-family:'Space Grotesk',sans-serif;
      font-size:16px;
      font-weight:600;
      letter-spacing:4px;
      color:rgba(5,215,218,0.8);
      text-transform:uppercase;
    }

    .nav-links{
      display:flex;
      gap:28px;
      background:rgba(0,5,15,0.5);
      border:1px solid rgba(5,215,218,0.18);
      border-top:2px solid var(--petrol);
      padding:10px 24px;
      backdrop-filter:blur(10px);
    }

    .nav-links a{
      color:rgba(255,255,255,0.95);
      text-decoration:none;
      font-family:'Space Grotesk',sans-serif;
      font-size:16px;
      font-weight:400;
      letter-spacing:0.5px;
      text-transform:capitalize;
      transition:color 0.3s ease,text-shadow 0.3s ease;
      text-shadow:0 2px 4px rgba(0,0,0,0.8);
    }

    .nav-links a:hover{
      color:var(--petrol);
    }

    /* ═══════════════════════════════════════════
       MAIN CONTENT
    ═══════════════════════════════════════════ */
    main{
      position:relative;
      z-index:10;
      padding-top:100px;
    }

    /* ═══════════════════════════════════════════
       SECTION HEADERS
    ═══════════════════════════════════════════ */
    .section-header{
      position:relative;
      z-index:10;
      display:flex;
      align-items:center;
      gap:16px;
      padding:88px 44px 0;
      max-width:1260px;
      margin:0 auto;
      width:100%;
    }

    .sec-orb{
      width:32px;
      height:32px;
      flex-shrink:0;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      background:rgba(26,143,160,0.09);
      border:1px solid rgba(26,143,160,0.36);
      animation:orb-pulse 3.2s ease-out infinite;
    }

    @keyframes orb-pulse{
      0%{box-shadow:0 0 0 0 rgba(26,143,160,0.4),0 0 12px rgba(26,143,160,0.20)}
      70%{box-shadow:0 0 0 8px rgba(26,143,160,0),0 0 12px rgba(26,143,160,0.20)}
      100%{box-shadow:0 0 0 0 rgba(26,143,160,0),0 0 12px rgba(26,143,160,0.20)}
    }

    .section-header h2{
      font-family:'Space Grotesk',sans-serif;
      font-size:9px;
      letter-spacing:4.5px;
      text-transform:uppercase;
      color:var(--teal-light);
      white-space:nowrap;
      opacity:0.88;
    }

    .sec-line{
      flex:1;
      height:1px;
      background:linear-gradient(to right,rgba(26,143,160,0.42),rgba(26,143,160,0.06),transparent);
    }

    /* ═══════════════════════════════════════════
       VIDEO GRID
    ═══════════════════════════════════════════ */
    .video-section{
      position:relative;
      z-index:10;
      padding:34px 44px 110px;
      max-width:1260px;
      margin:0 auto;
      width:100%;
    }

    .video-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:22px;
    }

    /* ═══════════════════════════════════════════
       VIDEO CARD
    ═══════════════════════════════════════════ */
    .video-card{
      position:relative;
      border-radius:20px;
      overflow:hidden;
      background:var(--bg2);
      border:1px solid rgba(26,143,160,0.16);
      box-shadow:0 20px 60px rgba(0,0,0,0.82),0 0 35px rgba(26,143,160,0.22);
      cursor:pointer;
      transition:box-shadow 0.45s,transform 0.65s cubic-bezier(0.22,1,0.36,1);
      will-change:transform;
      transform-style:preserve-3d;
      width:100%;
    }

    .video-card:hover{
      box-shadow:0 28px 78px rgba(0,0,0,0.88),0 0 48px rgba(26,143,160,0.38);
      transform:translateY(-2px);
    }

    .video-frame{
      position:relative;
      width:100%;
      aspect-ratio:9/16;
      overflow:hidden;
      border-radius:20px 20px 0 0;
      background:#000;
    }

    .video-facade{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background:linear-gradient(135deg,#0a0a0f 0%,#1a1a2e 100%);
      border-radius:20px 20px 0 0;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:all 0.3s ease;
      overflow:hidden;
    }

    .video-facade::before{
      content:'';
      position:absolute;
      inset:0;
      background:radial-gradient(circle at center,rgba(26,143,160,0.1) 0%,transparent 70%);
      opacity:0;
      transition:opacity 0.3s ease;
    }

    .video-facade:hover{
      background:linear-gradient(135deg,#0f0f1a 0%,#1f1f3e 100%);
    }

    .video-facade:hover::before{
      opacity:1;
    }

    .play-btn{
      position:relative;
      width:80px;
      height:80px;
      background:rgba(26,143,160,0.9);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all 0.3s ease;
      box-shadow:0 8px 32px rgba(26,143,160,0.3);
      z-index:2;
    }

    .video-facade:hover .play-btn{
      transform:scale(1.1);
      background:rgba(26,143,160,1);
      box-shadow:0 12px 48px rgba(26,143,160,0.5);
    }

    .play-btn svg{
      width:32px;
      height:32px;
      fill:#ffffff;
      margin-left:4px;
    }

    .video-loader{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:60px;
      height:60px;
      border:3px solid rgba(26,143,160,0.2);
      border-top:3px solid var(--teal);
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      0%{transform:translate(-50%,-50%) rotate(0deg)}
      100%{transform:translate(-50%,-50%) rotate(360deg)}
    }

    .video-frame iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      border-radius:20px 20px 0 0;
    }

    /* Video card footer */
    .video-footer{
      padding:13px 16px 16px;
      background:linear-gradient(to bottom,rgba(0,8,18,0.82),rgba(0,10,22,0.95));
      border-top:1px solid rgba(26,143,160,0.14);
    }

    .video-title{
      font-family:'Playfair Display',serif;
      font-size:14px;
      font-weight:600;
      letter-spacing:-0.5px;
      color:#fff;
      margin-bottom:4px;
    }

    .video-subtitle{
      font-family:'Cormorant Garamond',serif;
      font-size:11px;
      font-weight:400;
      color:var(--teal-light);
      opacity:0.75;
      letter-spacing:0.5px;
    }

    /* ═══════════════════════════════════════════
       FULLSCREEN MODAL
    ═══════════════════════════════════════════ */
    .video-overlay{
      position:fixed;
      inset:0;
      z-index:999;
      background:rgba(0,0,0,0);
      backdrop-filter:blur(0px);
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity 0.4s cubic-bezier(0.22,1,0.36,1),background 0.4s,backdrop-filter 0.4s,visibility 0.4s;
    }

    .video-overlay.active{
      background:rgba(0,0,0,0.92);
      backdrop-filter:blur(8px);
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .modal-video-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      /* Magia Vertical: El alto es el 85% de la pantalla, y el ancho se calcula automático en 9:16 */
      height: 85vh;
      width: calc(85vh * (9 / 16));
      max-width: 95vw;
      z-index: 1000;
      background: var(--bg2);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0,0,0,0.9), 0 0 60px rgba(26,143,160,0.4);
      opacity: 0;
      transition: opacity 0.4s, transform 0.4s;
    }

    .video-overlay.active .modal-video-card {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .modal-video-card .video-frame {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      margin: 0;
    }

    .modal-video-card .video-footer{
      display:none;
    }

    .close-btn{
      position:absolute;
      top:-50px;
      right:0;
      z-index:1001;
      width:44px;
      height:44px;
      border-radius:50%;
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.25);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      color:#fff;
      cursor:pointer;
      transition:background 0.2s,border-color 0.2s;
    }

    .close-btn:hover{
      background:rgba(26,143,160,0.4);
      border-color:var(--teal);
    }

    /* ═══════════════════════════════════════════
       HERO SECTION
    ═══════════════════════════════════════════ */
    .hero-section{
      position:relative;
      z-index:10;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:120px 44px 80px;
      background:linear-gradient(180deg,rgba(2,2,8,0.4) 0%,rgba(2,2,8,1) 100%);
      overflow:hidden;
    }

    .hero-container{
      position:relative;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:80px;
      max-width:1400px;
      width:100%;
    }

    .hero-orbit-wrapper{
      position:relative;
      width:400px;
      height:400px;
      flex-shrink:0;
      border-radius:50%;
      background:radial-gradient(circle at 50% 30%,rgba(26,143,160,0.08) 0%,transparent 70%);
      border:1px solid rgba(26,143,160,0.18);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 60px rgba(26,143,160,0.15),inset 0 0 40px rgba(26,143,160,0.06);
    }

    #orbitCanvas{
      width:100%;
      height:100%;
      max-width:400px;
      max-height:400px;
    }

    .hero-content{
      flex:1;
      max-width:600px;
    }

    .hero-label{
      font-family:'Space Grotesk',sans-serif;
      font-size:9px;
      letter-spacing:3px;
      text-transform:uppercase;
      color:var(--teal-light);
      margin-bottom:24px;
      opacity:0.88;
    }

    .hero-title{
      font-family:'Playfair Display',serif;
      font-size:58px;
      font-weight:600;
      line-height:1.2;
      letter-spacing:-1px;
      color:#fff;
      margin-bottom:16px;
    }

    .hero-accent{
      background:linear-gradient(135deg,var(--cyan),var(--teal-light));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    .hero-subtitle{
      font-family:'Cormorant Garamond',serif;
      font-size:28px;
      font-weight:500;
      font-style:italic;
      letter-spacing:0.5px;
      color:rgba(255,255,255,0.95);
      margin-bottom:32px;
      line-height:1.4;
      text-shadow:0 2px 10px rgba(0,0,0,0.8);
    }

    .hero-buttons{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .hero-btn{
      font-family:'Space Grotesk',sans-serif;
      font-size:10px;
      font-weight:700;
      letter-spacing:2px;
      text-transform:uppercase;
      padding:12px 24px;
      background:transparent;
      border:1px solid var(--teal);
      color:var(--teal);
      border-radius:6px;
      cursor:pointer;
      transition:all 0.3s ease;
    }

    .hero-btn:hover{
      background:rgba(26,143,160,0.1);
      border-color:var(--teal-light);
      color:var(--teal-light);
      box-shadow:0 0 20px rgba(26,143,160,0.25);
    }

    @keyframes hero-orbit-spin{
      0%{transform:rotateZ(0deg)}
      100%{transform:rotateZ(360deg)}
    }

    /* ═══════════════════════════════════════════
       RESPONSIVE HERO
    ═══════════════════════════════════════════ */
    @media(max-width:1024px){
      .video-grid{grid-template-columns:repeat(2,1fr)}
      nav{width:95%;padding:12px 20px}
      .section-header{padding:64px 22px 0}
      .video-section{padding:28px 22px 80px}
    }

    @media(max-width:1200px){
      .hero-container{gap:40px}
      .hero-orbit-wrapper{width:320px;height:320px}
      .hero-title{font-size:48px}
    }

    @media(max-width:900px){
      .hero-section{min-height:auto;padding:100px 22px 60px}
      .hero-container{flex-direction:column;gap:40px}
      .hero-orbit-wrapper{width:280px;height:280px}
      .hero-title{font-size:42px}
      .hero-subtitle{
      font-family:'Cormorant Garamond',serif;
      font-size:28px;
      font-weight:500;
      font-style:italic;
      letter-spacing:0.5px;
      color:rgba(255,255,255,0.95);
      margin-bottom:32px;
      line-height:1.4;
      text-shadow:0 2px 10px rgba(0,0,0,0.8);
    }
    }

    @media(max-width:600px){
      .hero-section{padding:80px 14px 40px;margin-top:0}
      .hero-orbit-wrapper{width:240px;height:240px}
      .hero-title{font-size:32px}
      .hero-subtitle{
      font-family:'Cormorant Garamond',serif;
      font-size:28px;
      font-weight:500;
      font-style:italic;
      letter-spacing:0.5px;
      color:rgba(255,255,255,0.95);
      margin-bottom:32px;
      line-height:1.4;
      text-shadow:0 2px 10px rgba(0,0,0,0.8);
    }
      .hero-buttons{gap:10px}
      .hero-btn{font-size:9px;padding:10px 16px}
      .video-grid{grid-template-columns:1fr;gap:16px}
      nav{flex-direction:column;gap:15px;width:95%}
      .nav-links{flex-wrap:wrap;justify-content:center;gap:12px;padding:8px 14px}
      .nav-links a{
      color:rgba(255,255,255,0.95);
      text-decoration:none;
      font-family:'Space Grotesk',sans-serif;
      font-size:15px;
      font-weight:500;
      letter-spacing:1px;
      text-transform:capitalize;
      transition:color 0.3s ease,text-shadow 0.3s ease;
      text-shadow:0 2px 4px rgba(0,0,0,0.8);
    }
      .section-header{padding:52px 14px 0;flex-direction:column;gap:12px}
      .sec-line{display:none}
      .video-section{padding:22px 14px 60px}
      .modal-video-card {
        width: 90vw;
        height: calc(90vw * (16 / 9)); /* Mantiene proporción 9:16 perfecta en mobile */
        max-height: 85vh;
        border-radius: 16px;
      }
      .modal-video-card .video-frame{border-radius:16px}
    }
  </style>
</head>
<body>

  <!-- FONDO ANIMADO -->
  <canvas id="bgCanvas"></canvas>

  <!-- NAVEGACIÓN -->
  <nav>
    <span class="logo">NYLON</span>
    <div class="nav-links">
      <a href="index.html#main-video">Inicio</a>
      <a href="somos.html">Somos</a>
      <a href="servicios.html">Servicios</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero-section">
    <div class="hero-container">
      <div class="hero-orbit-wrapper">
        <canvas id="orbitCanvas"></canvas>
      </div>
      <div class="hero-content">
        <div class="hero-label">◈ PORTFOLIO AUDIOVISUAL ◈</div>
        <h1 class="hero-title">
          Zona de <span class="hero-accent">Impulso Comercial</span>
        </h1>
        <p class="hero-subtitle">Generamos el magnetismo que tu proyecto requiere.</p>
        <div class="hero-buttons">
          <button class="hero-btn">Dirección</button>
          <button class="hero-btn">Producción</button>
          <button class="hero-btn">Marketing</button>
        </div>
      </div>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main>
    <!-- SECCIÓN INSTITUCIONALES -->
    <div class="section-header">
      <div class="sec-orb">◈</div>
      <h2>Institucionales</h2>
      <div class="sec-line"></div>
    </div>

    <section class="video-section">
      <div class="video-grid" id="institucionales-grid">
        <!-- Tarjetas se generarán con JS -->
      </div>
    </section>

    <!-- SECCIÓN CONTENIDO PROMOCIONAL -->
    <div class="section-header" style="margin-top:56px">
      <div class="sec-orb">◈</div>
      <h2>Contenido Promocional</h2>
      <div class="sec-line"></div>
    </div>

    <section class="video-section">
      <div class="video-grid" id="promocional-grid">
        <!-- Tarjetas se generarán con JS -->
      </div>
    </section>
  </main>

  <!-- OVERLAY MODAL -->
  <div class="video-overlay" id="videoOverlay"></div>

  <script>
    const videoData = {
      institucionales: [
        {
          id: '1209342794',
          title: 'Celsur',
          subtitle: 'Institucional · V1.3'
        },
        {
          id: '935095167',
          title: 'Programa - MI MPC',
          subtitle: 'Institucional - Jefatura de Gabinete'
        },
        {
          id: '1209345218',
          title: 'Deneb S.A',
          subtitle: 'Institucional · Deneb S.A'
        }
      ],
      promocional: [
        {
          id: '1209355971',
          title: 'Ferrari',
          subtitle: 'Sublime· Marketing',
        },
        {
          id: '1203649082',
          title: 'Blacksale',
          subtitle: 'Contenido · Promocional"',
        },
        {
          id: '1203649545',
          title: 'Desmontable Trekking',
          subtitle: 'Ripstop · Promocional',
        }
      ]
    };

    const overlay = document.getElementById('videoOverlay');
    let currentCard = null;

    // Generar tarjetas
    function generateCards(data, gridId) {
      const grid = document.getElementById(gridId);
      if (!grid) return;
      
      data.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.dataset.videoId = video.id;
        card.innerHTML = `
          <div class="video-frame">
            <div class="video-facade">
              <div class="play-btn">
                <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
              </div>
            </div>
          </div>
          <div class="video-footer">
            <div class="video-title">${video.title}</div>
            <div class="video-subtitle">${video.subtitle}</div>
          </div>
        `;
        card.addEventListener('click', () => openVideo(video.id, video.title, video.customIframe));
        grid.appendChild(card);

        // Fetch thumbnail from Vimeo API
        fetch(`https://vimeo.com/api/v2/video/${video.id}.json`)
          .then(response => response.json())
          .then(vimeoData => {
            if (vimeoData && vimeoData[0] && vimeoData[0].thumbnail_large) {
              const facade = card.querySelector('.video-facade');
              if (facade) {
                facade.style.backgroundImage = `url(${vimeoData[0].thumbnail_large})`;
                facade.style.backgroundSize = 'cover';
                facade.style.backgroundPosition = 'center';
              }
            }
          })
          .catch(err => console.error('Error fetching Vimeo thumbnail:', err));
      });
    }

    generateCards(videoData.institucionales, 'institucionales-grid');
    generateCards(videoData.promocional, 'promocional-grid');

    // Abrir video en fullscreen
    function openVideo(videoId, title, customIframe) {
      if (currentCard) return;

      // Crear modal
      const modal = document.createElement('div');
      modal.className = 'modal-video-card';
      modal.innerHTML = `
        <div class="close-btn">✕</div>
        <div class="video-frame">
          <div class="video-loader"></div>
        </div>
      `;
      overlay.appendChild(modal);
      overlay.classList.add('active');

      currentCard = modal;

      // Esperar y cargar iframe
      setTimeout(() => {
        const frame = modal.querySelector('.video-frame');
        frame.innerHTML = '';

        if (customIframe) {
            frame.innerHTML = customIframe;
            // Also append the Vimeo api script if needed
            const script = document.createElement('script');
            script.src = "https://player.vimeo.com/api/player.js";
            frame.appendChild(script);
        } else {
            const iframe = document.createElement('iframe');
            iframe.src = `https://player.vimeo.com/video/${videoId}?autoplay=1&color=1a8fa0&title=0&byline=0&portrait=0&muted=0`;
            iframe.allow = 'autoplay; fullscreen; picture-in-picture';
            iframe.referrerPolicy = 'strict-origin-when-cross-origin';
            iframe.frameBorder = '0';
            iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border-radius:20px 20px 0 0;';
            frame.appendChild(iframe);
        }

        // Close handlers
        const closeBtn = modal.querySelector('.close-btn');
        if (closeBtn) {
          closeBtn.addEventListener('click', closeVideo);
        }
      }, 300);
    }

    // Cerrar video
    function closeVideo() {
      if (!currentCard) return;

      overlay.classList.remove('active');
      currentCard.remove();
      currentCard = null;
    }

    // ESC key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && currentCard) {
        closeVideo();
      }
    });

    // Click en overlay para cerrar
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay && currentCard) {
        closeVideo();
      }
    });

    // ÓRBITA ANIMADA 3D MEJORADA
    (function() {
      const canvas = document.getElementById('orbitCanvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      
      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const cw = () => canvas.width / dpr;
      const ch = () => canvas.height / dpr;

      let time = 0;
      const particles = [];

      // Crear partículas para las órbitas
      for (let i = 0; i < 7; i++) {
        particles.push({
          radius: 40 + (i % 3) * 35,
          angle: Math.random() * Math.PI * 2,
          speed: 0.001 + Math.random() * 0.003,
          size: Math.random() * 2 + 1,
          opacity: Math.random() * 0.6 + 0.2,
          color: i % 2 === 0 ? 'rgba(0,200,220' : 'rgba(26,143,160'
        });
      }

      function draw() {
        time += 1;
        const centerX = cw() / 2;
        const centerY = ch() / 2;

        // Clear
        ctx.fillStyle = 'rgba(2,2,8,0.1)';
        ctx.fillRect(0, 0, cw(), ch());

        // Fondo radial sutil
        const bgGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 200);
        bgGrad.addColorStop(0, 'rgba(26,143,160,0.05)');
        bgGrad.addColorStop(1, 'rgba(26,143,160,0)');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, cw(), ch());

        ctx.save();
        ctx.translate(centerX, centerY);

        // Órbitas de fondo (3 anillos)
        const orbitData = [
          { r: 60, tilt: 0.2, opacity: 0.2, width: 1 },
          { r: 110, tilt: 0.4, opacity: 0.15, width: 0.8 },
          { r: 160, tilt: 0.1, opacity: 0.1, width: 0.6 }
        ];

        orbitData.forEach((orbit, idx) => {
          ctx.strokeStyle = `rgba(26,143,160,${orbit.opacity})`;
          ctx.lineWidth = orbit.width;
          ctx.beginPath();

          const tiltAmount = Math.sin(time * 0.0001) * orbit.tilt;
          for (let i = 0; i <= 100; i++) {
            const angle = (i / 100) * Math.PI * 2;
            const x = orbit.r * Math.cos(angle);
            const y = orbit.r * Math.sin(angle) * (0.4 + tiltAmount * 0.3);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.stroke();
        });

        // Partículas en órbitas
        particles.forEach(p => {
          p.angle += p.speed;

          const x = Math.cos(p.angle) * p.radius;
          const y = Math.sin(p.angle) * p.radius * 0.4;

          // Brillo
          const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, p.size * 3);
          glowGrad.addColorStop(0, p.color + ',' + (p.opacity * 0.8) + ')');
          glowGrad.addColorStop(1, p.color + ',0)');
          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(x, y, p.size * 3, 0, Math.PI * 2);
          ctx.fill();

          // Punto central
          ctx.fillStyle = p.color + ',' + p.opacity + ')';
          ctx.beginPath();
          ctx.arc(x, y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        // Núcleo central con pulsación
        const coreSize = 6 + Math.sin(time * 0.01) * 2;
        const coreOpacity = 0.4 + Math.sin(time * 0.008) * 0.2;

        ctx.fillStyle = `rgba(26,143,160,${coreOpacity})`;
        ctx.beginPath();
        ctx.arc(0, 0, coreSize, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(0,200,220,0.8)';
        ctx.beginPath();
        ctx.arc(0, 0, coreSize * 0.5, 0, Math.PI * 2);
        ctx.fill();

        // Aura central
        const auraGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, coreSize * 3);
        auraGrad.addColorStop(0, 'rgba(0,200,220,0.4)');
        auraGrad.addColorStop(1, 'rgba(0,200,220,0)');
        ctx.fillStyle = auraGrad;
        ctx.beginPath();
        ctx.arc(0, 0, coreSize * 3, 0, Math.PI * 2);
        ctx.fill();

        // Líneas conectoras (ocasionales)
        if (Math.sin(time * 0.0005) > 0.8) {
          ctx.strokeStyle = 'rgba(26,143,160,0.1)';
          ctx.lineWidth = 0.5;
          for (let i = 0; i < particles.length; i += 5) {
            const p1 = particles[i];
            const x1 = Math.cos(p1.angle) * p1.radius;
            const y1 = Math.sin(p1.angle) * p1.radius * 0.4;

            const p2 = particles[(i + 3) % particles.length];
            const x2 = Math.cos(p2.angle) * p2.radius;
            const y2 = Math.sin(p2.angle) * p2.radius * 0.4;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }
        }

        ctx.restore();
        requestAnimationFrame(draw);
      }

      draw();
    })();


    (function() {
      const cv = document.getElementById('bgCanvas');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      let W = cv.width = innerWidth;
      let H = cv.height = innerHeight;
      let stars = [];
      let shoots = [];

      function resize() {
        W = cv.width = innerWidth;
        H = cv.height = innerHeight;
      }
      window.addEventListener('resize', resize);

      // Crear estrellas
      for (let i = 0; i < 280; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.2 + 0.1,
          a: Math.random() * 0.6 + 0.15,
          da: (Math.random() * 0.008 + 0.002) * (Math.random() < 0.5 ? 1 : -1)
        });
      }

      // Función para crear cometa
      function createShoot() {
        return {
          x: Math.random() * W * 0.8 - 20,
          y: Math.random() * H * 0.4,
          vx: Math.random() * 8 + 4,
          vy: Math.random() * 2 + 0.5,
          len: Math.random() * 150 + 60,
          a: 1
        };
      }

      let frame = 0;

      function draw() {
        // Fondo
        ctx.fillStyle = 'rgba(2,2,8,0.8)';
        ctx.fillRect(0, 0, W, H);

        // Estrellas parpadantes
        for (const star of stars) {
          star.a += star.da;
          if (star.a > 0.7) star.da = -Math.abs(star.da);
          if (star.a < 0.1) star.da = Math.abs(star.da);

          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200,220,255,${star.a})`;
          ctx.fill();
        }

        // Cometas
        if (frame % 280 === 0) {
          shoots.push(createShoot());
        }

        for (let i = shoots.length - 1; i >= 0; i--) {
          const shoot = shoots[i];
          shoot.x += shoot.vx;
          shoot.y += shoot.vy;
          shoot.a -= 0.012;

          if (shoot.a <= 0) {
            shoots.splice(i, 1);
            continue;
          }

          const grad = ctx.createLinearGradient(
            shoot.x - shoot.len,
            shoot.y - (shoot.vy / shoot.vx) * shoot.len,
            shoot.x,
            shoot.y
          );
          grad.addColorStop(0, 'rgba(255,255,255,0)');
          grad.addColorStop(0.5, `rgba(100,220,255,${shoot.a * 0.5})`);
          grad.addColorStop(1, `rgba(200,255,255,${shoot.a})`);

          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(shoot.x - shoot.len, shoot.y - (shoot.vy / shoot.vx) * shoot.len);
          ctx.lineTo(shoot.x, shoot.y);
          ctx.stroke();
        }

        frame++;
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
